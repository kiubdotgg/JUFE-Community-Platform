<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园交友 - Campus Friends</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== Auth Modal ==================== -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2 id="authTitle">登录</h2>
    <p class="subtitle" id="authSubtitle">欢迎回到校园交友平台</p>
    <div id="authError" class="error-msg"></div>
    <form id="authForm">
      <div class="form-group" id="usernameGroup" style="display:none">
        <label>用户名</label>
        <input class="input" id="authUsername" placeholder="请输入用户名" autocomplete="off">
      </div>
      <div class="form-group">
        <label>邮箱</label>
        <input class="input" id="authEmail" type="email" placeholder="请输入校园邮箱" autocomplete="off">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="input" id="authPassword" type="password" placeholder="请输入密码" autocomplete="off">
      </div>
      <div class="form-group" id="confirmGroup" style="display:none">
        <label>确认密码</label>
        <input class="input" id="authConfirmPassword" type="password" placeholder="请再次输入密码" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="authSubmitBtn">登录</button>
    </form>
    <p class="toggle-link" id="authToggle">
      还没有账号？<a id="toggleAuthMode">立即注册</a>
    </p>
  </div>
</div>

<!-- ==================== App Layout ==================== -->
<div id="appLayout" class="app-layout" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="icon">🎓</div>
      <span>校园交友</span>
    </div>
    <ul class="sidebar-nav">
      <li><a data-page="feed" class="active"><span class="nav-icon">🏠</span> 动态广场</a></li>
      <li><a data-page="recommend"><span class="nav-icon">🎯</span> 交友推荐</a></li>
      <li><a data-page="friends"><span class="nav-icon">👥</span> 我的好友</a></li>
      <li><a data-page="profile"><span class="nav-icon">👤</span> 个人中心</a></li>
      <li><a id="logoutBtn" style="color:#ef4444"><span class="nav-icon">🚪</span> 退出登录</a></li>
    </ul>
  </aside>

  <main class="main-content">
    <!-- ===== Feed Page ===== -->
    <div id="page-feed" class="page active">
      <div class="topbar"><h1>📢 动态广场</h1></div>
      <div class="card post-composer" id="postComposer">
        <div class="avatar" id="composerAvatar"></div>
        <div class="input-area">
          <textarea class="input textarea" id="postContent" placeholder="分享你的校园生活..."></textarea>
          <div class="actions">
            <span style="font-size:12px;color:var(--text-secondary)">支持文字动态</span>
            <button class="btn btn-primary btn-sm" id="publishBtn">发布动态</button>
          </div>
        </div>
      </div>
      <div id="feedList"></div>
      <div id="feedLoading" class="loading" style="display:none">加载中...</div>
    </div>

    <!-- ===== Recommend Page ===== -->
    <div id="page-recommend" class="page">
      <div class="topbar"><h1>🎯 交友推荐</h1></div>
      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:20px">根据你的学校、专业和兴趣，为你推荐可能认识的同学</p>
      <div id="recommendList" class="recommend-grid"></div>
      <div id="recommendLoading" class="loading" style="display:none">正在为你匹配...</div>
    </div>

    <!-- ===== Friends Page ===== -->
    <div id="page-friends" class="page">
      <div class="topbar"><h1>👥 我的好友</h1></div>
      <div class="tabs">
        <button class="tab active" data-friend-tab="list">好友列表</button>
        <button class="tab" data-friend-tab="pending">好友申请</button>
      </div>
      <div id="friendListContent"></div>
    </div>

    <!-- ===== Profile Page ===== -->
    <div id="page-profile" class="page">
      <div class="topbar"><h1>👤 个人中心</h1></div>
      <div id="profileContent"></div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
